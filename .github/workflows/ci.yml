name: ci

on:
  push:
    branches: [main, 'build/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build HvViewer.sln -c Release
      - name: Generate performance log (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/ci/make-perf-log.ps1
      - name: Test
        run: dotnet test HvViewer.sln -c Release --no-build
      - name: Publish (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/HvViewer.App -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o out/HvViewer
      - name: Zip (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path out/HvViewer -DestinationPath "HvViewer-${{ github.ref_name }}-win-x64.zip"
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "HvViewer-${{ github.ref_name }}-win-x64.zip" --generate-notes
